version: V1.10
evaluation_name: btc_4h_long_only_v1_10
profile: galapagos_4h
asset: BTC/USD
timeframe: 4h
source_policies:
  - state_aware_breakout
  - state_aware_momentum
min_bars_per_window: 80
warmup_bars: 50
min_spacing_bars: 3

experiment_hypothesis: "Disable SHORT decisions because V1.9C showed SHORT trades degraded all calibration/validation windows."
holdout_policy: "Do not execute holdout until long-only is validated on calibration and validation."

trade_constraints:
  allow_long: true
  allow_short: false
  short_policy: "fallback_no_trade"
  allow_hold: true
  allow_close: true

windows:
  calibration:
    label: calibration
    max_candidates: 20
    purpose: "debug seulement, autorisé pour inspection"
  validation_1:
    label: validation_1
    max_candidates: 20
    purpose: "évaluation intermédiaire"
  validation_2:
    label: validation_2
    max_candidates: 20
    purpose: "évaluation intermédiaire"
  holdout:
    label: holdout
    max_candidates: 20
    purpose: "test final intouchable, ne pas utiliser pour modifier le prompt"
