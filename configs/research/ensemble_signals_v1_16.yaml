# Ensemble Signal Lab Config V1.16

dataset_path: data/gold/research_dataset/BTC/4h/research_dataset_with_alpha_scores.parquet
predictions_path: data/gold/ml_predictions/BTC/4h/ml_predictions_v1_16_2.parquet

ensemble_methods:
  - mean_probability
  - median_probability
  - majority_vote
  - weighted_score
  - conservative_consensus

thresholds:
  top_bucket_pct: [0.05, 0.10, 0.20]
  min_agreement: [0.6, 0.7, 0.8]
  min_probability: 0.55
  min_cost_adjusted_edge: 0.0

windows:
  - validation_2024
  - validation_2025
  - recent_2026

random_trials: 1000

cost_threshold: 0.003
alpha_score_col: alpha_score_v1_14
combined_alpha_col: combined_alpha_score
regime_cols:
  - macro_regime_score
  - derivatives_regime_score

weights:
  rf_classifier: 1.0
  hist_gb_classifier: 1.0
